name: PR 6221 black-only formatter
on:
  push:
    branches:
      - ci/review-6221-black-format
    paths:
      - .github/workflows/review-6221-black-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/review-6221-black-format
      - name: Confirm tested original parent
        run: test "$(git rev-parse HEAD^)" = "2a8235d2d324216d251e7213517f89af2bd00a09"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply pinned formatter
        run: |
          python -m pip install black==26.10.1
          python -m black apps/predbat/currency.py apps/predbat/tests/test_currency_calibration.py
      - name: Commit only formatted Python files to isolated branch
        run: |
          git add apps/predbat/currency.py apps/predbat/tests/test_currency_calibration.py
          if git diff --cached --quiet; then
            echo "No formatting changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style: format currency files with upstream pinned Black"
            git push origin HEAD:ci/review-6221-black-format
          fi
