name: PR 6221 final regression after Compare fixture repair
on:
  push:
    branches:
      - ci/review-6221-compare-regression
permissions:
  contents: read
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cdde0fbf48f0927ad108fe3841de9d2fda32662f
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install pre-commit
      - run: pre-commit run --all-files
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cdde0fbf48f0927ad108fe3841de9d2fda32662f
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q apps/predbat
      - run: bash apps/predbat/build_kernel.sh
      - name: Currency, kernel, metric, execute and Compare checks
        env:
          PREDBAT_KERNEL_REQUIRED: '1'
        run: |
          cd coverage
          python ../apps/predbat/unit_test.py --test currency_scale --test currency_calibration --test currency_debug_plan --test kernel_parity --test manual_soc --test manual_soc_max --test compute_metric --test execute --test compare
      - name: Complete upstream quick suite
        env:
          PREDBAT_KERNEL_REQUIRED: '1'
        run: |
          cd coverage
          python ../apps/predbat/unit_test.py --quick
