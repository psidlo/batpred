name: PR 6221 review validation (isolated)
on:
  push:
    branches:
      - ci/review-6221-2a8235d

permissions:
  contents: read

jobs:
  regression:
    name: currency + kernel parity + execute + quick regression
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2a8235d2d324216d251e7213517f89af2bd00a09
          persist-credentials: false
      - name: Confirm exact PR revision
        run: test "$(git rev-parse HEAD)" = "2a8235d2d324216d251e7213517f89af2bd00a09"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify Python syntax
        run: python -m compileall -q apps/predbat
      - name: Build native prediction kernel
        run: bash apps/predbat/build_kernel.sh
      - name: Targeted currency, kernel, manual SoC, metric and execute regressions
        env:
          PREDBAT_KERNEL_REQUIRED: "1"
        run: |
          cd coverage
          python ../apps/predbat/unit_test.py --test currency_scale --test currency_calibration --test currency_debug_plan --test kernel_parity --test manual_soc --test manual_soc_max --test compute_metric --test execute
      - name: Upstream quick regression suite
        env:
          PREDBAT_KERNEL_REQUIRED: "1"
        run: |
          cd coverage
          python ../apps/predbat/unit_test.py --quick

  lint:
    name: upstream pre-commit checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2a8235d2d324216d251e7213517f89af2bd00a09
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pre-commit
        run: python -m pip install pre-commit
      - name: Run all configured pre-commit checks
        run: pre-commit run --all-files

  kernel-binaries:
    name: cross-build six kernels and verify x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2a8235d2d324216d251e7213517f89af2bd00a09
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Rebuild all target kernels
        run: bash apps/predbat/build_kernel_cross.sh
      - name: Verify six production binaries
        run: |
          test "$(find apps/predbat -maxdepth 1 -name 'prediction_kernel_lib_*.so' | wc -l)" -ge 6
          cd coverage
          python ../apps/predbat/verify_kernel_binary.py ../apps/predbat/prediction_kernel_lib_x86_64.so
